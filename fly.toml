app = "omniroute-gateway"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/app/data"
  STORAGE_DRIVER = "sqlite"
  AUTH_COOKIE_SECURE = "true"

[[mounts]]
  source = "omniroute_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
